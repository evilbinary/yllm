# yllm serve 统一配置(多模型)
# 用法:
#   yllm hub --config serve.yaml                # 合并模式(推荐): 每模型一组 rank + server 线程
#   yllm supervisor --config serve.yaml         # 分开模式 supervisor
#   yllm ctl start / yllm ctl stop / yllm ctl status
# 多模型: models 列表, 每个模型独立一组 rank(端口 rank-port-base + mi*stride)和一个 server(server-port + mi*stride)
# stride = 所有模型 ranks 的最大值; 下面 ranks 全为 1, stride=1:
#   mi=0 qwen38       rank 9410 / server 9420(外部部署)
#   mi=1 qwen2.5-7b   rank 9411 / server 9421(本机)
#   mi=2 tinyllama    rank 9412 / server 9422(本机)

# 日志
log: logs/serve.log
log-level: info

bin: ./build/avx2/yllm.exe

# 端口(模型 mi 的 rank 基址 = rank-port-base + mi*stride, server 端口 = server-port + mi*stride)
sv-port: 9500          # supervisor 心跳口
router-port: 9400      # router 客户端口
server-port: 9420      # 模型0 server 端口
rank-port-base: 9410   # 模型0 rank 推理口基址
http-port: 8000        # OpenAI 兼容 HTTP(可选, 0 关闭)
cache-dir: ./sessions   # 会话缓存落盘目录(空 = 纯内存; server 存 token 列表, rank 存 KV)
budget-auto: 1             # 自动内存模式(按可用内存)

# 拓扑
sv-host: 127.0.0.1     # supervisor 地址(rank/server 心跳目标)
router-addrs: 127.0.0.1:9400   # supervisor 通知的 router 列表
servers: 1

# 行为
auto-heal: 0           # qwen38 rank 在远程, 本机不重拉(外部 rank 死亡由远端 supervisor 管)
strategy: least        # 路由策略: least | round-robin

# 租用策略(server 向 sv 租用 rank 的方式)
#   request: 每次推理 LEASE/RELEASE(用完即释放)
#   timed:   定时租用, 到期自动回池(lease-duration 秒)
#   permanent: 永久租用, 直到 server 退出/死亡
lease-strategy: request

# ---- 多模型 ----
# 每个模型独立一组 rank + 一个 server。
# ranks: 该模型启动的 rank 推理进程数(>=1 由 supervisor/hub 自动拉起)。
#        ranks: 0 = 该模型 rank 由外部机器承担(分布式部署), 本机不拉起。
# local: 本机拉起的段数(-1 未指定 = 全部; 0 = 全部外部; N = 前 N 段本地)。
models:
  - name: qwen38
    model: models/qwen3.8-27b.llf
    vocab: models/qwen3.vocab.txt
    ranks: 1           # 总段数(单 rank, 全部在远程: 远程单机 1.8 tok/s > 双机 0.89)
    local: 0           # 本机拉起的段数(0 = 全部外部部署; 远程手工起 rank, 端口 9410)
  - name: qwen2.5
    model: models/qwen2.5-7b.llf
    vocab: models/qwen2.5-7b.vocab.txt
    ranks: 1           # 本模型 rank 进程数(全部本机)
  - name: tinyllama
    model: models/tinyllama-1.1b-chat-v1.0.Q4_K_M.llf
    vocab: models/tinyllama.vocab.txt
    ranks: 1           # 本模型 rank 进程数(全部本机)