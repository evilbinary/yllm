# yllm serve 分布式配置(rank 拆段: 本机 rank0 + 远程 rank1)
# 用法:
#   yllm hub --config serve-dist.yaml          # 本机: supervisor+router+server(http 8000)
#   远程节点手工起 rank1: yllm rank --model <llf> --vocab <vocab> --port 9411
#                        --rank 1 --ranks 2 --supervisor <本机IP>:9500 --id rank-1
# ranks: 该模型总段数; local: 本机拉起的段数(1 = 只 rank0 本地, 其余外部)

# 日志
log: logs/serve.log
log-level: info

bin: ./build/avx2/yllm

# 端口(模型 mi 的 rank 基址 = rank-port-base + mi*stride, server 端口 = server-port + mi*stride)
sv-port: 9500          # supervisor 心跳口
router-port: 9400      # router 客户端口
server-port: 9420      # 模型0 server 端口
rank-port-base: 9410   # 模型0 rank 推理口基址
http-port: 8000        # OpenAI 兼容 HTTP(可选, 0 关闭)

# 拓扑
sv-host: 127.0.0.1     # 本机 hub 内部角色心跳目标
router-addrs: 127.0.0.1:9400
servers: 1

# 行为
auto-heal: 1           # 自愈(外部 rank 由外部 supervisor 管, 本机不重拉)
strategy: least

# 租用策略(server 向 sv 租用 rank 的方式)
#   request: 每次推理 LEASE/RELEASE(用完即释放)
#   timed:   定时租用, 到期自动回池(lease-duration 秒)
#   permanent: 永久租用, 直到 server 退出/死亡
lease-strategy: request

# ---- 模型(2 段流水线: 本机 rank0 + 远程 rank1) ----
models:
  - name: tinyllama
    model: models/tinyllama-1.1b-chat-v1.0.Q4_K_M.llf
    vocab: models/tinyllama.vocab.txt
    ranks: 2           # 总段数(模型按层拆 2 段)
    local: 1           # 本机拉起的段数(rank0 本地, rank1 远程)
